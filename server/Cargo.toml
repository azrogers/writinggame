[package]
name = "writinggame-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
as-any = "0.3.2"
chrono = { version = "0.4.41", features = ["serde"] }
config = "0.15.11"
dashmap = "6.1.0"
erased-serde = "0.4.6"
futures = "0.3.31"
futures-util = "0.3.31"
hmac = "0.12.1"
itertools = "0.14.0"
jwt = "0.16.0"
log = "0.4.27"
log4rs = "1.3.0"
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.17"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
warp = "0.3"
